<div class="img-zoom-container ">
  <div class="outerImg " (mouseenter)="showZoomWin() " (mouseleave)="hideZoomWin() ">
      <img #myimage id="myimage" class="mainImg" src={{thumbImage}} style="vertical-align: middle !important;" [style.width]="imgWidth" [style.height]="imgHeight" (mousemove)="imageZoom();">
      <div #zoomDiv id="zoomDiv" class="img-zoom-lens"></div>
      
  </div>
</div>
<div *ngIf="showZoom">
  <div #myresult id="myresult" class="img-zoom-result"></div>
</div>
