<div class="contactPage">

    <div class="bgMain">
        <div class="container">
            <h1 class="title">Contact Us</h1>
            <div>
                <a routerLink="/">Home</a>
                <i class="fa-solid fa-angle-right"></i>
                <a routerLink="/contact-us">Contact Us</a>
         </div>
        </div>
    </div>

    <div class="container">
        <div class="contactForm">
            <div class="row">
                <div class="col-md-8">
                    <div class="leftBox">
                        <h3 class="title2">Get in touch</h3>
                        <p>We are always here to help out whatever way we can</p>

                        <form class="form">
                            <div class="formBox">
                                <!-- <label for="name">Tell Us Your Name</label> -->
                                <input type="text" class="form-control" placeholder="Tell Us Your Name" aria-label="name">
                            </div>
                            <div class="formBox">
                                <!-- <label for="email">Enter Your Email</label> -->
                                <input type="email" class="form-control" placeholder="Enter Your Email" aria-label="email">
                            </div>
                            <div class="formBox">
                                <!-- <label for="phone">Enter Your Contact Number</label> -->
                                <input type="text" class="form-control" placeholder="Enter Your Contact Number" aria-label="phone">
                            </div>
                            <div class="formBox">
                                <!-- <label for="message">Message</label> -->
                                <textarea name="Message" id="message" placeholder="Message" class="form-control"></textarea>
                            </div>
                            <button (click)="contactEmail()">Submit</button>
                        </form>
                    </div>
                </div>
                <div class="col-md-4 colorSec">
                    <div class="rightBox">
                        <div class="companyInfo">
                            <div class="companyInfoBox">
                                <div class="iconBox">
                                    <i class="fa-solid fa-location-dot"></i>
                                </div>
                                <div class="textBox">
                                    <h3 class="companyTitle">Address</h3>
                                    <p class="companyText">
                                        Building No. 1, Dumdum, Kolkata - 700129, West Bengal, India
                                    </p>
                                </div>
                            </div>
                            <div class="companyInfoBox">
                                <div class="iconBox">
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                                <div class="textBox">
                                    <h3 class="companyTitle">Lets Talk</h3>
                                    <a href="tel:+9118003456789" class="companyLink">
                                        1800-345-6789
                                    </a>
                                </div>
                            </div>
                            <div class="companyInfoBox">
                                <div class="iconBox">
                                    <i class="fa-solid fa-envelope"></i>
                                </div>
                                <div class="textBox">
                                    <h3 class="companyTitle">General Support</h3>
                                    <a href="mailto:contact@leafylane.com" class="companyLink">
                                        contact&#64;leafylane.com
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- <h3 class="title2 mb-4">Find us on map</h3> -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d230.1829738560034!2d88.39722345018039!3d22.61917931650297!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39f89d00268a75fd%3A0xf58c8829f6811e2d!2sTara%20Maa%20Villa!5e0!3m2!1sen!2sin!4v1766044913630!5m2!1sen!2sin" style="border:0;width: 100%;height: 40rem;border-radius: 12px;margin-bottom: 2rem;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
</div>
